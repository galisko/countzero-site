<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">MCP Tool Poisoning trust boundary</title>
  <desc id="desc">A terminal-style diagram shows an operator connecting through an MCP server to an agent context, with a poisoned response intercepted by a policy gate.</desc>
  <defs>
    <radialGradient id="glow" cx="68%" cy="46%" r="54%"><stop offset="0" stop-color="#153622"/><stop offset="1" stop-color="#070a08"/></radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#152019" stroke-width="1"/></pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#glow)"/>
  <rect width="1600" height="900" fill="url(#grid)" opacity=".7"/>
  <circle cx="1090" cy="390" r="230" fill="#36ff79" opacity=".035" filter="url(#soft)"/>
  <g font-family="IBM Plex Mono, Menlo, monospace">
    <text x="88" y="112" fill="#65ff92" font-size="28">COUNTZERO // FIELD TEST 004</text>
    <text x="88" y="210" fill="#f0f5f1" font-size="64" font-weight="700">MCP TOOL</text>
    <text x="88" y="282" fill="#65ff92" font-size="64" font-weight="700">POISONING</text>
    <text x="92" y="336" fill="#78867d" font-size="21">real handshake · real tools/call · controlled follow-up</text>
  </g>
  <g font-family="IBM Plex Mono, Menlo, monospace" font-size="19">
    <rect x="90" y="435" width="300" height="150" rx="8" fill="#0b100d" stroke="#34433a"/>
    <text x="124" y="482" fill="#a9b8ae">OPERATOR</text><text x="124" y="523" fill="#65ff92">synthetic-ticket-001</text><text x="124" y="557" fill="#66746b">authorized scope</text>
    <rect x="520" y="435" width="330" height="150" rx="8" fill="#160e10" stroke="#9a3c48"/>
    <text x="554" y="482" fill="#ff8d98">POISONED MCP</text><text x="554" y="523" fill="#d6c2c5">security_audit()</text><text x="554" y="557" fill="#9c7378">untrusted directive</text>
    <rect x="980" y="435" width="340" height="150" rx="8" fill="#0b100d" stroke="#477657"/>
    <text x="1014" y="482" fill="#65ff92">POLICY GATE</text><text x="1014" y="523" fill="#d4ddd7">metadata + return scan</text><text x="1014" y="557" fill="#65ff92">FOLLOW_UP: BLOCKED</text>
    <path d="M390 510h130" stroke="#68776d" stroke-width="3"/><path d="m505 498 15 12-15 12" fill="none" stroke="#68776d" stroke-width="3"/>
    <path d="M850 510h130" stroke="#ff6876" stroke-width="3"/><path d="m965 498 15 12-15 12" fill="none" stroke="#ff6876" stroke-width="3"/>
    <path d="M1148 585v92H685v-92" fill="none" stroke="#65ff92" stroke-width="3" stroke-dasharray="10 10"/>
    <text x="816" y="715" fill="#65ff92">RETEST: TOXIC FLOW REMOVED</text>
  </g>
  <g font-family="IBM Plex Mono, Menlo, monospace" font-size="17" fill="#77857c">
    <text x="88" y="830">STREAMABLE HTTP / 127.0.0.1 / SYNTHETIC DATA / EVIDENCE PRESERVED</text>
    <text x="1320" y="830" fill="#65ff92">CZ_004</text>
  </g>
</svg>
